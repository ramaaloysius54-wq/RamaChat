name: CI/CD Pipeline Rama DevOps

on:
  push:
    branches:
      - main

jobs:
  deploy-to-vps:
    name: Sync & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Sync & Deploy via SSH/Rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync

          echo "1. Sinkronisasi file ke VPS..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/aplication"
          
          sshpass -e rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.buildozer' \
            --exclude='bin' \
            -e "ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22" \
            ./ "$VPS_USER@$VPS_HOST:/var/www/aplication/"

          echo "2. Menjalankan Docker & Kubernetes Deployment..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -p 22 "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            cd /var/www/aplication
            docker build -t ramachat-otp-server:latest .
            if command -v k3s &> /dev/null; then
              docker save ramachat-otp-server:latest | sudo k3s ctr images import - || true
            fi
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml
            kubectl rollout restart deployment/ramachat-otp-server || true
            kubectl get pods
          ENDSSH
