apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ramachat-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/USERNAME_ANDA/RamaChat.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ramachat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
